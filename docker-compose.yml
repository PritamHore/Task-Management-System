services:
  db:
    image: postgres:16-alpine
    container_name: task-management-db
    restart: always
    environment:
      POSTGRES_DB: task-management-db
      POSTGRES_USER: pritam
      POSTGRES_PASSWORD: pritamroot
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pritam -d task-management-db"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: task-management-app
    restart: on-failure
    ports:
      - "10001:10001"
    environment:
      DB_URL: jdbc:postgresql://db:5432/task-management-db
      DB_USERNAME: pritam
      DB_PASSWORD: pritamroot
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: